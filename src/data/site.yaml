bio: I am Esteban Gómez, **researcher**, **audio programmer** and **sound engineer** currently based in Brussels, Belgium. With a broad range of interests, my experience spans real-time machine learning audio research, professional music recording and production for international live events, audio plugin development, and music performance. I am fascinated by everything that can be programmed/produce sound or has knobs/buttons/strings.
