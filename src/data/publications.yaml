- title: Performance and Complexity Trade-off Optimization of Speech Models During Training
  type: Paper
  year: '2026'
  authors: Esteban Gómez, Tom Bäckström
  venue: Preprint. This work has been submitted to the IEEE for possible publication
  links:
  - label: Download
    href: https://arxiv.org/abs/2601.13704
  keywords: Speech machine learning, low-complexity, voice activity detection, deep fake detection
  abstract: |
    In speech machine learning, neural network models are typically designed by choosing an architecture with fixed layer sizes and structure. These models are then trained to maximize performance on metrics aligned with the task’s objective. While the overall architecture is usually guided by prior knowledge of the task, the sizes of individual layers are often chosen heuristically. However, this approach does not guarantee an optimal trade-off between performance and computational complexity; consequently, post hoc methods such as weight quantization or model pruning are typically employed to reduce computational cost. This occurs because stochastic gradient descent (SGD) methods can only optimize differentiable functions, while factors influencing computational complexity, such as layer sizes and floating-point operations per second (FLOP/s), are non-differentiable and require modifying the model structure during training. We propose a reparameterization technique based on feature noise injection that enables joint optimization of performance and computational complexity during training using SGD-based methods. Unlike traditional pruning methods, our approach allows the model size to be dynamically optimized for a target performance-complexity trade-off, without relying on heuristic criteria to select which weights or structures to remove. We demonstrate the effectiveness of our method through three case studies, including a synthetic example and two practical real-world applications: voice activity detection and audio anti-spoofing. The code related to our work is publicly available to encourage further research.
  bibtex: "@misc{gomez2026,\ntitle={Performance and Complexity Trade-off Optimization of Speech Models During Training}, \nauthor={Esteban Gómez and Tom Bäckström},\nyear={2026},\neprint={2601.13704},\narchivePrefix={arXiv},\nprimaryClass={cs.SD},\nurl={https://arxiv.org/abs/2601.13704}, \n}\n"
- title: Real-time Joint Noise Suppression and Bandwidth Extension of Noisy Reverberant Wideband Speech
  type: Paper
  year: '2024'
  authors: Esteban Gómez, Tom Bäckström
  venue: Published at the International Workshop on Acoustic Signal Enhancement (IWAENC 2024, Aalborg, Denmark)
  links:
  - label: Download
    href: https://research.aalto.fi/en/publications/real-time-joint-noise-suppression-and-bandwidth-extension-of-nois
  - label: Demo
    href: https://eagomez2.github.io/rt-joint-ns-bwe/
  keywords: Bandwidth extension, noise suppression, real-time, deep learning, multitasking
  abstract: |
    Artificially extending the bandwidth of speech in band-limited scenarios using 16kHz (known as wideband) or lower sample rates such as in VoIP or some Bluetooth applications, can significantly improve its perceptual quality. Typically, clean speech is assumed as input to estimate the missing spectral information. However, such an assumption falls short if it has been contaminated by noise or reverb, resulting in audible artifacts. We propose a low-complexity multitasking neural network capable of performing noise suppression and bandwidth extension 16kHz to 48kHz (fullband) in real-time on a CPU, mitigating such issues even if the noise cannot be completely removed from the input. Instead of employing a monolithic model, we adopt a modular approach and complexity reduction methods that result in a more compact model than the sum of its parts while improving its performance.
